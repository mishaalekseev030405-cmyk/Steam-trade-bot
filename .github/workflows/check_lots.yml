
name: Check Live Market Lots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs2-check-live-lots
  cancel-in-progress: false

jobs:
  check-lots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27,<1"

      - name: Check actual market lots
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          DRY_RUN: "true"
        run: |
          python -u check_live_lots.py

      - name: Confirm read-only mode
        if: always()
        run: |
          echo "Market check completed"
          echo "Real purchases: DISABLED"
