name: CS2 Trade One Tests

on:
  pull_request:
    paths:
      - 'CS2_Trade_One/**'
      - '.github/workflows/cs2-trade-one-tests.yml'
  push:
    branches: [main]
    paths:
      - 'CS2_Trade_One/**'
      - '.github/workflows/cs2-trade-one-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CS2_Trade_One
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all bot modules
        run: python -m compileall -q .
      - name: Run safe simulation and Telegram panel tests
        run: python -m unittest discover -s tests -v
