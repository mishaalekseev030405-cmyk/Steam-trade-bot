
name: CS2 Market Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan CS2 Market
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Market API
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
        run: |
          python -u check_api.py

      - name: Run CS2 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          DRY_RUN: "true"
        run: |
          echo "STARTING CS2 BOT"
          python -u monitor.py
          echo "CS2 BOT FINISHED"
