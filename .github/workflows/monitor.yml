
name: CS2 Market Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan CS2 Market
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile scanner.py monitor.py

      - name: Run CS2 scanner
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          DRY_RUN: "true"
        run: |
          python -u monitor.py

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-scan-${{ github.run_id }}
          path: |
            latest_results.json
            scan_progress.json
            sent_alerts.json
          if-no-files-found: ignore
          retention-days: 7
