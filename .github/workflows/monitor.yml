
name: CS2 Market Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan CS2 Market
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Market API
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
        run: |
          python -u check_api.py

      - name: Run CS2 scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          DRY_RUN: "true"
        run: |
          echo "STARTING CS2 BOT"
          python -u monitor.py
          echo "CS2 BOT FINISHED"

      - name: Save scanner progress
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_alerts.json purchases.json scan_progress.json

          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Save CS2 bot scanner progress"

            for attempt in 1 2 3; do
              echo "Push attempt $attempt"

              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict - stopping safely"
                git rebase --abort
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Scanner progress saved"
                exit 0
              fi

              sleep 5
            done

            echo "Failed to save scanner progress"
            exit 1
          fi
