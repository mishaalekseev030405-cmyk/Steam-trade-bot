
name: CS2 Market Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      
      - name: Test Market API
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
        run: python check_api.py

      - name: Check market
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
        run: python monitor.py

      - name: Save alert history
        run: |
          if ! git diff --quiet -- sent_alerts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_alerts.json
            git commit -m "Update sent alerts"
            git push
          fi
