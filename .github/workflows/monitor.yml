
name: CS2 Market Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install 'httpx>=0.27,<1'

      - name: Check Python files
        run: |
          python -m py_compile scanner.py
          python -m py_compile monitor.py
          python -m py_compile trade_guard.py
          python -m py_compile purchase_approval.py
          python -m py_compile purchase_ledger.py

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Restore scanner state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          from pathlib import Path

          api = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
          )

          headers = {
              "Authorization": (
                  "Bearer " + os.environ["GH_TOKEN"]
              ),
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          for filename in [
              "scan_progress.json",
              "candidate_history.json",
              "purchase_ledger.json"
          ]:
              url = (
                  api + "/contents/" + filename
                  + "?ref=scanner-state"
              )

              request = urllib.request.Request(
                  url, headers=headers
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = json.load(response)

                  content = base64.b64decode(
                      data["content"]
                  )

                  parsed = json.loads(content)

                  if filename == "scan_progress.json":
                      cursor = parsed.get("cursor")
                      if (
                          type(cursor) is not int
                          or cursor < 0
                      ):
                          raise ValueError("Invalid cursor")

                  elif filename == "candidate_history.json":
                      if not isinstance(parsed, list):
                          raise ValueError("Invalid history")

                  elif filename == "purchase_ledger.json":
                      if (
                          not isinstance(parsed, dict)
                          or parsed.get("version") != 1
                          or not isinstance(
                              parsed.get("operations"), list
                          )
                      ):
                          raise ValueError(
                              "Invalid purchase ledger"
                          )

                  Path(filename).write_bytes(content)
                  print("Restored:", filename)

              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
                  if filename == "purchase_ledger.json":
                      raise RuntimeError(
                          "Purchase ledger missing in scanner-state. "
                          "Initialize it explicitly before running."
                      ) from exc
                  print("No saved file:", filename)
          PY

      - name: Check purchase ledger
        run: python -u purchase_ledger.py

      - name: Run CS2 scanner
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          DRY_RUN: 'true'
          MARKET_OFFER_PRICE_UNIT: 'kopecks'
          MARKET_HISTORY_PRICE_UNIT: 'rubles'
          TELEGRAM_SCAN_REPORTS: 'false'
        run: python -u monitor.py

      - name: Prepare purchase proposal
        env:
          DRY_RUN: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -u purchase_approval.py

      - name: Save scanner state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.error
          from pathlib import Path

          api = (
              "https://api.github.com/repos/"
              + os.environ["REPO"]
          )

          headers = {
              "Authorization": (
                  "Bearer " + os.environ["GH_TOKEN"]
              ),
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def request(method, url, payload=None):
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return json.load(response)

          branch = "scanner-state"

          try:
              request(
                  "GET",
                  api + "/git/ref/heads/" + branch
              )
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

              main = request(
                  "GET",
                  api + "/git/ref/heads/"
                  + os.environ["GITHUB_REF_NAME"]
              )

              request(
                  "POST",
                  api + "/git/refs",
                  {
                      "ref": "refs/heads/" + branch,
                      "sha": main["object"]["sha"]
                  }
              )

          for filename in [
              "scan_progress.json",
              "candidate_history.json",
              "purchase_ledger.json"
          ]:
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      "Missing state file: " + filename
                  )

              parsed = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if filename == "scan_progress.json":
                  cursor = parsed.get("cursor")
                  if (
                      type(cursor) is not int
                      or cursor < 0
                  ):
                      raise ValueError("Invalid cursor")

              elif filename == "candidate_history.json":
                  if not isinstance(parsed, list):
                      raise ValueError("Invalid history")

              elif filename == "purchase_ledger.json":
                  if (
                      not isinstance(parsed, dict)
                      or parsed.get("version") != 1
                      or not isinstance(
                          parsed.get("operations"), list
                      )
                  ):
                      raise ValueError(
                          "Invalid purchase ledger"
                      )

              url = api + "/contents/" + filename

              sha = None

              try:
                  existing = request(
                      "GET",
                      url + "?ref=" + branch
                  )
                  sha = existing["sha"]

              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

              payload = {
                  "message": "Update CS2 scanner state",
                  "content": base64.b64encode(
                      path.read_bytes()
                  ).decode("ascii"),
                  "branch": branch
              }

              if sha:
                  payload["sha"] = sha

              request("PUT", url, payload)

              print("Saved:", filename)
          PY

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-results-${{ github.run_id }}
          path: |
            latest_results.json
            scan_progress.json
            scan_diagnostics.json
            profitable_candidates.json
            candidate_history.json
            purchase_proposal.json
            purchase_ledger.json
          if-no-files-found: warn
          retention-days: 7
