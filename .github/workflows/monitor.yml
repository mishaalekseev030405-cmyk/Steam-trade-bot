name: CS2 Market Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: cs2-market-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Restore progress
        uses: actions/cache/restore@v4
        with:
          path: scan_progress.json
          key: cs2-progress-${{ github.run_id }}
          restore-keys: |
            cs2-progress-
      - name: Validate source
        run: python -m py_compile scanner.py monitor.py
      - name: Run scanner
        env:
          MARKET_CSGO_API_KEY: ${{ secrets.MARKET_CSGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          DRY_RUN: 'true'
        run: python -u monitor.py
      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scan_progress.json
          key: cs2-progress-${{ github.run_id }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-results-${{ github.run_id }}
          path: |
            latest_results.json
            scan_progress.json
          if-no-files-found: ignore
